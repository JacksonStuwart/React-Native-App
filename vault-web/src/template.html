<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="/*CSP*/">
<title>Vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z' fill='%235c5c8a'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f4f8;--surface:#fff;--surface-2:#f0f0f6;--text:#1c1c28;--muted:#6b6b80;
  --border:#e2e2ec;--brand:#5c5c8a;--brand-ink:#fff;--brand-soft:#ebebf5;
  --danger:#c0392b;--ok:#1f8a5b;--shadow:0 1px 2px rgba(20,20,40,.06),0 8px 24px rgba(20,20,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111118;--surface:#1a1a24;--surface-2:#22222e;--text:#ececf4;--muted:#9a9ab0;
  --border:#2c2c3a;--brand:#a3a3d6;--brand-ink:#16162a;--brand-soft:#262640;
  --danger:#ff7a6b;--ok:#5fd39b;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.shell{max-width:420px;margin:0 auto;padding:48px 16px 32px;display:flex;flex-direction:column;gap:20px}
.shell.wide{max-width:760px;padding-top:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:17px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.logo .icon{width:18px;height:18px;stroke:currentColor;fill:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
h1{font-size:21px;margin:0;letter-spacing:-.015em}
.muted{color:var(--muted);margin:0 0 8px}
.small{font-size:13px;margin:0}
.center{text-align:center}
label{font-size:13px;font-weight:600;margin-top:6px}
input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
button{font:inherit;cursor:pointer;border:0;border-radius:9px}
button:disabled{opacity:.6;cursor:default}
.primary{background:var(--brand);color:var(--brand-ink);padding:11px 14px;font-weight:600;margin-top:10px}
.primary:hover:not(:disabled){filter:brightness(1.07)}
.link{background:none;color:var(--muted);padding:6px;font-size:13px;align-self:center}
.link:hover{color:var(--text)}
.ghost{background:transparent;color:var(--text);border:1px solid var(--border);padding:7px 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.ghost:hover{background:var(--surface-2)}
.ghost .icon{width:15px;height:15px}
.error{color:var(--danger);font-size:13px;margin:4px 0 0;min-height:0}
.error:empty{display:none}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:8px 0 0}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px}
.summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;background:var(--brand-soft);color:var(--brand);padding:3px 10px;border-radius:999px;font-weight:600}
.search-wrap{position:relative}
.search-wrap>.icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{padding-left:36px}
.list{display:grid;gap:10px}
.entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;box-shadow:var(--shadow)}
.entry.dim{opacity:.6}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.name{font-weight:650}
.row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:5px 6px 5px 10px;min-width:0}
.label{font-size:12px;color:var(--muted);width:68px;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;flex:1;min-width:0;overflow-wrap:anywhere}
.secret{letter-spacing:.12em;color:var(--muted)}
.icon-btn{background:transparent;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:7px}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#fff}
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--border);border-radius:11px;padding:14px;margin:4px 0 6px;cursor:pointer;transition:border-color .15s,background .15s;font-weight:400}
.drop:hover,.drop.over,.visually-hidden:focus-visible+.drop{border-color:var(--brand);background:var(--brand-soft)}
.drop.ready{border-style:solid;border-color:color-mix(in srgb,var(--ok) 55%,var(--border))}
.drop>.icon{width:22px;height:22px;color:var(--brand)}
.drop-text{display:flex;flex-direction:column;min-width:0}
.drop-text strong{font-size:14px}
.file-name{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:520px){.label{width:58px}.shell{padding-top:28px}}
</style>
</head>
<body>
<div id="app"><main class="shell"><p class="muted center">Loading…</p></main></div>
<noscript><p style="text-align:center">This page needs JavaScript.</p></noscript>
<!-- Optional: paste your vault JSON export between these two tags to skip choosing a file. -->
<script type="application/json" id="vault-data"></script>
<script>/*BUNDLE*/</script>
</body>
</html>
